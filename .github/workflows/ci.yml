name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' 
        cache: true

    - name: Verify dependencies
      run: |
        go mod tidy
        git diff --exit-code || (echo "Dependencies are not tidy. Run 'go mod tidy'." && exit 1)

    - name: Run go fmt
      run: |
        go fmt ./...
        git diff --exit-code || (echo "Code is not formatted. Run 'go fmt ./...'." && exit 1)

    - name: Run go vet
      run: go vet ./...

    - name: Run Unit Tests
      run: go test -v -race ./...

    - name: Run Benchmarks
      run: go test -bench=. -benchmem ./...
